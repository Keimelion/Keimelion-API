name: Release

# main only moves through release PRs (dev → main, merge commit): CI → semantic-release.
# Deploys come from dev (deploy.yml): no production stack exists yet.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: Keimelion/Keimelion-Infra/.github/workflows/node-ci.yml@v0.1.5

  release:
    needs: ci
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: Keimelion/Keimelion-Infra/.github/workflows/release.yml@v0.1.5
    secrets: inherit
