name: Deploy

# Deploys dev to the pre-prod once CI is green on a push; can also be run by hand.
# Not a job of ci.yml: its cancel-in-progress could stop a deploy during a migration.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    uses: Keimelion/Keimelion-Infra/.github/workflows/deploy.yml@v0.1.5
