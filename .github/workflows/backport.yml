name: Backport release to dev

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Open PR main → dev
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if backport is needed
        id: check
        run: |
          git fetch origin
          if ! git rev-parse origin/dev >/dev/null 2>&1; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "dev branch does not exist yet, skipping"
            exit 0
          fi
          DIFF=$(git log origin/dev..origin/main --oneline)
          if [ -z "$DIFF" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "No new commits to backport"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create backport PR
        if: steps.check.outputs.needed == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh pr create \
            --base dev \
            --head main \
            --title "chore: backport release v${VERSION} to dev" \
            --body "Automatic backport of release **v${VERSION}** changes (\`CHANGELOG.md\`, \`package.json\`) from \`main\` to \`dev\`."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
