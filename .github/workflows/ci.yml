name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: Keimelion/Keimelion-Infra/.github/workflows/node-ci.yml@v0.1.0

  pr-title:
    if: github.event_name == 'pull_request'
    uses: Keimelion/Keimelion-Infra/.github/workflows/pr-title.yml@v0.1.0

  # Patch/minor Dependabot bumps merge themselves once ci and pr-title are green.
  dependabot-automerge:
    needs: [ci, pr-title]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: Keimelion/Keimelion-Infra/.github/workflows/dependabot-automerge.yml@v0.1.0
