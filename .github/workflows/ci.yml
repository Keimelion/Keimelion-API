name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: Keimelion/Keimelion-Infra/.github/workflows/node-ci.yml@main

  pr-title:
    if: github.event_name == 'pull_request'
    uses: Keimelion/Keimelion-Infra/.github/workflows/pr-title.yml@main
