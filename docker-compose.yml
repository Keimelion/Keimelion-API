services:
  db:
    image: postgres:16-alpine
    container_name: keimelion_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keimelion_dev
      POSTGRES_USER: keimelion
      POSTGRES_PASSWORD: keimelion_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
